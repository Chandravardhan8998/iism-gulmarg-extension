name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: iism-gulmarg-autofill
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
